name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (PyBullet is not needed: the tests use a fake simulator)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy scikit-image matplotlib opencv-python-headless pytest ruff
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
